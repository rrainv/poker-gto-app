name: Node CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check canonical entry-point syntax
        run: |
          node --check app/src/core/logic.js
          node --check app/main.js

      - name: Run canonical Node test suite
        run: node --test tests/*.test.js tests/*.test.mjs
